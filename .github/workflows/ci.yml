name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm exec biome check ./src

      # Главная проверка фронта. Сгенерированные типы закоммичены, поэтому
      # бэкенд для неё поднимать не надо: проверяется, что код согласован
      # с ТЕМ контрактом, который лежит в репозитории.
      - name: Types
        run: pnpm typecheck

      - name: Build
        run: pnpm build
